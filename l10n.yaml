# flutter gen-l10n configuration (Module A contract).
#
# Other module agents (C/D/E/F) add feature strings via FRAGMENT files in
# lib/l10n/fragments/ (<module>_en.json / <module>_ur.json) — see
# lib/l10n/fragments/FRAGMENTS.md. They MUST NOT edit app_en.arb / app_ur.arb
# directly; Agent A merges fragments into the ARB files.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
nullable-getter: false
format: true
