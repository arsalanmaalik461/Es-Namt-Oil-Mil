name: namt_oil_mil
description: "Namt Oil Mil — 100% offline digital khata and accounts for a Pakistani oil mill."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# ---------------------------------------------------------------------------
# DEPENDENCY NOTES:
# Core dependencies work fully offline — zero network calls, zero
# cloud/backend, zero Firebase. The app runs 100% offline by default.
#
# GOOGLE / WHATSAPP INTEGRATION (added 2026-10-18 per explicit user request):
# The packages below are used ONLY for opt-in features the user asked for:
#   - google_sign_in / googleapis: optional Google Drive backup (Settings).
#     Nothing is uploaded unless the user taps "Google se connect karein".
#   - workmanager: optional 24-hour automatic Drive backup scheduler.
#   - flutter_secure_storage: stores Google auth state securely on-device.
#   - url_launcher: opens WhatsApp chats (wa.me links) for statement sharing.
# Offline-first behavior is unchanged: every feature above degrades
# gracefully with no network, and the app never requires Google sign-in.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.14.0
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  uuid: ^4.5.1
  collection: ^1.19.0
  # Opt-in Google Drive backup (user-requested 2026-10-18)
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^14.0.0
  googleapis_auth: ^2.3.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  url_launcher: ^6.3.2
  # Reminders/sharing gaps (Team 6, 2026-10-18): bill photo + contact import
  image_picker: ^1.2.4
  flutter_contacts: ^2.6.0
  # App lock (PIN + biometric) — user-requested 2026-10-18
  local_auth: ^3.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.2

flutter:
  generate: true
  uses-material-design: true
